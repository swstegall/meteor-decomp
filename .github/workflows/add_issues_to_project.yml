name: Add issues to project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/swstegall/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: Apply repo label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (!labels.includes('Meteor Decomp')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['Meteor Decomp']
              });
            }

      - name: Notify Discord
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"<@&1510380634349109440>, Issue created for Meteor Decomp.\nTitle: ${{ github.event.issue.title }}\n${{ github.event.issue.html_url }}\"
            }"
